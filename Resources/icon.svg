<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E333B"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.745" stop-color="#60A5FA"/>
      <stop offset="0.765" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFAFA"/>
      <stop offset="1" stop-color="#C9CBD1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-60%" width="160%" height="260%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-200%" y="-20%" width="500%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle macOS (grille 824 px) -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#rim)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Repère 100 % -->
  <line x1="300" y1="430" x2="724" y2="430" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- Pistes -->
  <g fill="#08090B">
    <rect x="354" y="250" width="36" height="530" rx="18"/>
    <rect x="494" y="250" width="36" height="530" rx="18"/>
    <rect x="634" y="250" width="36" height="530" rx="18"/>
  </g>

  <!-- Remplissages -->
  <rect x="360" y="610" width="24" height="164" rx="12" fill="url(#blue)"/>
  <rect x="500" y="480" width="24" height="294" rx="12" fill="url(#blue)"/>
  <g>
    <rect x="640" y="320" width="24" height="454" rx="12" fill="url(#orange)" filter="url(#glow)" opacity="0.7"/>
    <rect x="640" y="320" width="24" height="454" rx="12" fill="url(#orange)"/>
  </g>

  <!-- Boutons de fader -->
  <g filter="url(#shadow)">
    <rect x="312" y="582" width="120" height="56" rx="16" fill="url(#knob)"/>
    <rect x="452" y="452" width="120" height="56" rx="16" fill="url(#knob)"/>
    <rect x="592" y="292" width="120" height="56" rx="16" fill="url(#knob)"/>
  </g>
  <g stroke="#8B8F98" stroke-width="5" stroke-linecap="round">
    <line x1="342" y1="610" x2="402" y2="610"/>
    <line x1="482" y1="480" x2="542" y2="480"/>
    <line x1="622" y1="320" x2="682" y2="320" stroke="#EA7A2E"/>
  </g>
</svg>
